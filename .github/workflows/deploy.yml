name: Build and Push Images

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials for ECR, S3, EventBridge, and EC2 deployment
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push one Docker image per service
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          for service in api-gateway auth-service todo-service file-service notification-service audit-service search-service frontend; do
            repo="$REGISTRY/todo-$service"
            aws ecr describe-repositories --repository-names "todo-$service" >/dev/null 2>&1 || aws ecr create-repository --repository-name "todo-$service"
            if [ "$service" = "frontend" ]; then
              docker build -f frontend/Dockerfile -t "$repo:${{ github.sha }}" -t "$repo:latest" .
            else
              docker build -f services/$service/Dockerfile -t "$repo:${{ github.sha }}" -t "$repo:latest" .
            fi
            docker push "$repo:${{ github.sha }}"
            docker push "$repo:latest"
          done

      - name: Next manual step
        run: echo "Images were pushed to ECR. SSH to EC2 from your own machine and run the README deployment commands."

      - name: Notify Slack on success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST \
            -H 'Content-type: application/json' \
            --data '{"text":"Todo microservices images were pushed to ECR."}' \
            "$SLACK_WEBHOOK_URL"

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST \
            -H 'Content-type: application/json' \
            --data '{"text":"Todo microservices image build/push failed. Check GitHub Actions logs."}' \
            "$SLACK_WEBHOOK_URL"
