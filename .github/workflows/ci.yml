name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  service-checks:
    name: Lint and test ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - @todo/api-gateway
          - @todo/auth-service
          - @todo/todo-service
          - @todo/file-service
          - @todo/notification-service
          - @todo/audit-service
          - @todo/search-service
          - @todo/frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install workspace dependencies
        run: npm install
      - name: Generate Prisma clients where needed
        run: npm -w ${{ matrix.workspace }} run prisma:generate --if-present
      - name: Run ESLint
        run: npm -w ${{ matrix.workspace }} run lint --if-present
      - name: Run Jest or Vitest tests
        run: npm -w ${{ matrix.workspace }} run test --if-present

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: service-checks
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        service: [api-gateway, auth-service, todo-service, file-service, notification-service, audit-service, search-service]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build image without pushing
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t todo/${{ matrix.service }}:${{ github.sha }} .

  pr-summary:
    name: PR test summary
    runs-on: ubuntu-latest
    needs: service-checks
    if: github.event_name == 'pull_request'
    steps:
      - name: Comment summary on PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "CI completed for all service workspaces. See the Checks tab for per-service logs."
            });
