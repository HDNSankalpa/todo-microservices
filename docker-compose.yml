services:
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    env_file:
      - services/api-gateway/.env.example
    environment:
      PORT: 3000
      TODO_SERVICE_URLS: http://todo-service:3002,http://todo-service-2:3002,http://todo-service-3:3002
    ports: ["3000:3000"]
    depends_on: [auth-service, todo-service, file-service, notification-service, search-service, redis]

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    env_file:
      - services/auth-service/.env.example
    ports: ["3001:3001"]
    depends_on: [postgres-auth, rabbitmq, redis]

  todo-service:
    build:
      context: .
      dockerfile: services/todo-service/Dockerfile
    env_file:
      - services/todo-service/.env.example
    ports: ["3002:3002"]
    depends_on: [postgres-todo, rabbitmq]

  todo-service-2:
    build:
      context: .
      dockerfile: services/todo-service/Dockerfile
    env_file:
      - services/todo-service/.env.example
    environment:
      PORT: 3002
    depends_on: [postgres-todo, rabbitmq]

  todo-service-3:
    build:
      context: .
      dockerfile: services/todo-service/Dockerfile
    env_file:
      - services/todo-service/.env.example
    environment:
      PORT: 3002
    depends_on: [postgres-todo, rabbitmq]

  file-service:
    build:
      context: .
      dockerfile: services/file-service/Dockerfile
    env_file:
      - services/file-service/.env.example
    ports: ["3003:3003"]
    depends_on: [postgres-files, rabbitmq]

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    env_file:
      - services/notification-service/.env.example
    ports: ["3004:3004"]
    depends_on: [mongo-notifications, rabbitmq, redis]

  audit-service:
    build:
      context: .
      dockerfile: services/audit-service/Dockerfile
    env_file:
      - services/audit-service/.env.example
    ports: ["3005:3005"]
    depends_on: [mongo-audit, rabbitmq]

  search-service:
    build:
      context: .
      dockerfile: services/search-service/Dockerfile
    env_file:
      - services/search-service/.env.example
    ports: ["3006:3006"]
    depends_on: [postgres-todo, rabbitmq]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_URL: http://localhost:3000/api
      VITE_SOCKET_URL: http://localhost:3004
    ports: ["5173:5173"]
    depends_on: [api-gateway]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    ports: ["8080:80"]
    depends_on: [api-gateway, frontend]

  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: authdb
    ports: ["5433:5432"]
    volumes: [postgres-auth:/var/lib/postgresql/data]

  postgres-todo:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: tododb
    ports: ["5434:5432"]
    volumes: [postgres-todo:/var/lib/postgresql/data]

  postgres-files:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: files
      POSTGRES_PASSWORD: files
      POSTGRES_DB: filesdb
    ports: ["5435:5432"]
    volumes: [postgres-files:/var/lib/postgresql/data]

  mongo-notifications:
    image: mongo:7
    ports: ["27018:27017"]
    volumes: [mongo-notifications:/data/db]

  mongo-audit:
    image: mongo:7
    ports: ["27019:27017"]
    volumes: [mongo-audit:/data/db]

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
    volumes: [rabbitmq:/var/lib/rabbitmq]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    profiles: ["elastic"]

volumes:
  postgres-auth:
  postgres-todo:
  postgres-files:
  mongo-notifications:
  mongo-audit:
  rabbitmq:
