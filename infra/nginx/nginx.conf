events {}

http {
  gzip on;
  gzip_types text/plain application/json application/javascript text/css;

  upstream api_gateway { server api-gateway:3000; }
  upstream auth_service { server auth-service:3001; }
  upstream todo_service {
    server todo-service:3002;
    server todo-service-2:3002;
    server todo-service-3:3002;
  }
  upstream file_service { server file-service:3003; }
  upstream notification_service { server notification-service:3004; }
  upstream search_service { server search-service:3006; }

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri /index.html;
    }

    location /api/auth/ {
      proxy_pass http://auth_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    location /api/todos/ {
      proxy_pass http://todo_service/todos/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    location /api/files/ {
      proxy_pass http://file_service/files/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    location /api/notifications/ {
      proxy_pass http://notification_service/notifications/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    location /api/search/ {
      proxy_pass http://search_service/search/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    location /socket.io/ {
      proxy_pass http://notification_service;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
  }
}
